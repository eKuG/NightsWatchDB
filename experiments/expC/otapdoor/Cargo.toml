[package]
name = "otapdoor"
version = "0.1.0"
edition = "2021"

[dependencies]
arrow = { version = "=60.2.0", default-features = false, features = ["ipc_compression"] }
prost = "=0.14.6"
tonic = { version = "=0.14.9", default-features = false, features = ["server", "router", "codegen", "zstd"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net"] }
tokio-stream = "=0.1.19"
bytes = "=1.12.2"
crc32c = "=0.6.9"
sha2 = "=0.11.1"
opentelemetry-proto = { version = "=0.33.1", default-features = false, features = ["gen-tonic-messages", "trace"] }

[profile.release]
lto = "thin"
codegen-units = 1

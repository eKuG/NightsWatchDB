[workspace]
resolver = "3"
members = ["crates/*"]
# The experiments are standalone packages and keep building on their own.
exclude = ["experiments"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/eKuG/NightsWatchDB"
publish = false
rust-version = "1.100"

[workspace.dependencies]
# arrow and parquet must always move together: every arrow-* crate and any
# future parquet crate must be pinned to the same version, and bumped in one
# commit.
arrow-array = "=60.2.0"
arrow-schema = "=60.2.0"
parquet = { version = "=60.2.0", default-features = false }

bytes = "=1.12.2"
crc32c = "=0.6.9"
opentelemetry-proto = { version = "=0.33.1", default-features = false }
prost = "=0.14.6"
rand = "=0.9.5"
tempfile = "=3.27.0"

# The server speaks HTTP itself on hyper; axum only routes the query API.
# tonic is kept for tests, as a real gRPC client. These crates are pinned to
# the versions tonic and axum already use, so the build has one copy of each.
tonic = { version = "=0.14.9", default-features = false }
tokio = "=1.54.1"
axum = { version = "=0.8.9", default-features = false }
hyper = { version = "=1.13.0", default-features = false }
hyper-util = { version = "=0.1.21", default-features = false }
http = "=1.5.0"
http-body-util = "=0.1.5"
flate2 = "=1.1.11"
zstd = { version = "=0.14.5", default-features = false }

serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
thiserror = "=2.0.17"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1

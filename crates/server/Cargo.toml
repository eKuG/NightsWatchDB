[package]
name = "nightswatchdb"
description = "The NightsWatchDB server: an OTLP gRPC door for traces and a small HTTP query API"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
name = "nwdb_server"

[[bin]]
name = "nightswatchdb"
path = "src/main.rs"

[dependencies]
nwdb-core = { path = "../core" }
nwdb-engine = { path = "../engine" }
nwdb-otlp = { path = "../otlp" }
nwdb-wal = { path = "../wal" }
arrow-array.workspace = true
serde_json.workspace = true
bytes.workspace = true
hyper = { workspace = true, features = ["http1", "http2", "server"] }
hyper-util = { workspace = true, features = ["tokio", "service"] }
http.workspace = true
http-body-util.workspace = true
flate2.workspace = true
zstd.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net"] }
axum = { workspace = true, features = ["http1", "tokio"] }

[dev-dependencies]
hyper = { workspace = true, features = ["client", "http2"] }
# A real gRPC client for the tests.
tonic = { workspace = true, features = ["channel", "codegen", "gzip", "zstd"] }
tempfile.workspace = true
prost.workspace = true
opentelemetry-proto = { workspace = true, features = ["gen-tonic-messages", "trace"] }

[lints]
workspace = true
